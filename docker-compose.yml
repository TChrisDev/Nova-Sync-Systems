# Nova Sync Systems en Docker.
#
#   cp .env.docker.example .env     (y completa los valores marcados)
#   docker compose up -d --build
#   → http://localhost:8080
#
# Servicios:
#   web        nginx: sirve la interfaz y reenvía la API a PHP-FPM (único puerto publicado)
#   app        Laravel en PHP-FPM; al arrancar migra y sincroniza permisos
#   scheduler  Programador de tareas (abre cada mes de las mensualidades)
#   db         PostgreSQL 16 con sus datos en un volumen
#   kafka      Apache Kafka (KRaft, un nodo): bus de eventos del ERP
#   realtime-relay    publica en Kafka los eventos de outbox_events
#   realtime-gateway  consume Kafka y envía los cambios al navegador (SSE)
#
# Los secretos salen del archivo .env de esta carpeta, que nunca se sube al
# repositorio. Si falta uno obligatorio, Compose se detiene y lo dice.

name: nova-sync

x-backend-env: &backend-env
  APP_NAME: "Nova Sync Systems"
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${APP_URL:-http://localhost:8080}
  FRONTEND_URL: ${APP_URL:-http://localhost:8080}
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: en
  APP_TIMEZONE: UTC
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}

  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-nova_sync}
  DB_USERNAME: ${DB_USERNAME:-nova}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}

  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_SAME_SITE: lax
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  CACHE_STORE: database
  QUEUE_CONNECTION: database

  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8080/auth/microsoft/callback}

  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
  GOOGLE_WORKSPACE_DOMAINS: ${GOOGLE_WORKSPACE_DOMAINS:-}

  # Eventos de dominio hacia Kafka y tiempo real en el navegador.
  NOVA_EVENTS_ENABLED: ${NOVA_EVENTS_ENABLED:-true}
  NOVA_REALTIME_SECRET: ${NOVA_REALTIME_SECRET:?Define NOVA_REALTIME_SECRET en el archivo .env}

  NOVA_AUTO_PROVISION_USERS: ${NOVA_AUTO_PROVISION_USERS:-false}
  NOVA_ALLOWED_EMAIL_DOMAINS: ${NOVA_ALLOWED_EMAIL_DOMAINS:-}

  # Correo de las notificaciones (proyectos por vencer). Con "log" los
  # correos quedan en el registro del contenedor en lugar de enviarse.
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
  MAIL_FROM_NAME: "Nova Sync Systems"
  NOVA_PROJECT_DEADLINE_DAYS: ${NOVA_PROJECT_DEADLINE_DAYS:-15,7,1,0}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nova_sync}
      POSTGRES_USER: ${DB_USERNAME:-nova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin puertos publicados: solo la aplicación llega a la base de datos.
    # Para revisarla desde tu equipo, descomenta (queda solo en localhost):
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build:
      context: ./backend
    image: nova-sync/backend:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: nova-sync/backend:local
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *backend-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    build:
      context: ./frontend
    image: nova-sync/web:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los tópicos los crea el relay con sus particiones; nadie los crea por error.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Retención de los eventos: 7 días (para reprocesar o sincronizar otros sistemas).
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    # Sin puertos publicados: solo los servicios de Docker llegan a Kafka.
    # Para conectar herramientas desde tu equipo agrega un listener externo
    # (ver docs/realtime-kafka.md).

  realtime-relay:
    build:
      context: ./realtime
    image: nova-sync/realtime:local
    restart: unless-stopped
    command: ["relay"]
    environment:
      NOVA_REALTIME_MODE: relay
      KAFKA_BROKERS: kafka:9092
      NOVA_EVENTS_TOPIC_PREFIX: ${NOVA_EVENTS_TOPIC_PREFIX:-nova}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DB_DATABASE:-nova_sync}
      PGUSER: ${DB_USERNAME:-nova}
      PGPASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      kafka:
        condition: service_healthy
      # outbox_events la crean las migraciones que corre "app" al arrancar.
      app:
        condition: service_healthy

  realtime-gateway:
    image: nova-sync/realtime:local
    restart: unless-stopped
    command: ["gateway"]
    environment:
      NOVA_REALTIME_MODE: gateway
      KAFKA_BROKERS: kafka:9092
      NOVA_EVENTS_TOPIC_PREFIX: ${NOVA_EVENTS_TOPIC_PREFIX:-nova}
      NOVA_REALTIME_SECRET: ${NOVA_REALTIME_SECRET:?Define NOVA_REALTIME_SECRET en el archivo .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      realtime-relay:
        condition: service_started

volumes:
  pgdata:
  storage:
  kafkadata:
